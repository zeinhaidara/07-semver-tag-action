name: Semver tag
description: Work out the next version from conventional commits, update the changelog and tag it.
inputs:
  dry-run:
    description: Print the next version only. No changelog, tag or push.
    default: "false"
runs:
  using: composite
  steps:
    - name: Release
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry-run }}
      run: bash "${{ github.action_path }}/scripts/release.sh"
